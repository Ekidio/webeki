<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#161922">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WEBEKI MOBIL">
<title>WEBEKI MOBIL – weboldal építő telefonra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link id="pageFont" rel="stylesheet" href="">
<link rel="stylesheet" href="../css/editor.css?v=1.2">
<link rel="stylesheet" href="mobile.css?v=1.2">
<style id="pageCss"></style>
</head>
<body class="wkm">

<!-- A szerkesztő motorja (../js/app.js) ugyanaz, mint az asztali WEBEKI-é: az elemek azonosítói (id) ezért egyeznek. -->
<header id="top" class="ui">
  <div class="brand"><span class="logo-mark">W</span><span class="bt">WEBEKI <b>MOBIL</b></span><small id="ver"></small></div>
  <div class="spacer"></div>
  <div class="grp">
    <button id="btnUndo" title="Visszavonás"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
    <button id="btnRedo" title="Újra"><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg></button>
  </div>
  <div class="grp" id="devices">
    <button data-dev="desktop" title="Asztali nézet"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M8 20h8M12 16v4"/></svg></button>
    <button data-dev="tablet" title="Tablet nézet"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M11 18h2"/></svg></button>
    <button data-dev="mobile" class="on" title="Mobil nézet"><svg viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M11 18h2"/></svg></button>
  </div>
  <button id="btnMenu" class="mbtn" title="Menü" aria-label="Menü"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg></button>
</header>

<div id="mmenu" class="ui" hidden>
  <button id="btnNew">＋ Új weboldal sablonból</button>
  <button id="btnOpen">📂 Projekt megnyitása</button>
  <button id="btnSave">💾 Projekt mentése fájlba</button>
  <input type="file" id="fileOpen" accept=".json,application/json" hidden>
  <button id="btnPreview">👁 Előnézet új lapon</button>
  <div class="mm-sec">Megjelenés szerkesztése</div>
  <div class="grp scope" id="scope">
    <button data-scope="all" class="on">🔗 Minden nézet</button>
    <button data-scope="only">📌 Csak <span id="scopeDev">Mobil</span></button>
  </div>
  <button id="btnHelp">❓ Súgó</button>
  <a class="mm-link" href="../">🖥 Asztali WEBEKI</a>
  <div class="mm-st"><span id="status">Mentve</span></div>
</div>

<main>
  <section id="stage" data-dev="mobile">
    <div id="zoomInfo"></div>
    <div id="page" class="wk-page"></div>
  </section>
</main>

<div id="libSheet" class="sheet" data-state="closed">
  <div class="grab" data-grab="lib"></div>
  <aside id="lib" class="ui">
    <div class="panel-h">Blokkok – koppints a hozzáadáshoz <button type="button" class="sh-x" data-close="lib" aria-label="Bezárás">✕</button></div>
    <input id="libSearch" type="search" placeholder="Keresés…">
    <div id="libList"></div>
    <div class="lib-tip credit">ECKERT ANDRÁS - Vibe Coder 2026</div>
  </aside>
</div>

<div id="inspSheet" class="sheet" data-state="closed">
  <div class="grab" data-grab="insp"></div>
  <aside id="insp" class="ui"></aside>
</div>

<nav id="mbar" class="ui">
  <button type="button" data-m="lib"><b>＋</b><span>Blokk</span></button>
  <button type="button" data-m="page"><b>⚙</b><span>Oldal</span></button>
  <button type="button" id="btnRandom"><b>🎲</b><span>Random</span></button>
  <button type="button" id="btnExport" class="pri"><b>⇩</b><span>Export</span></button>
</nav>

<div id="dropLine"></div>
<div id="modal" class="ui" hidden></div>
<div id="toasts" class="ui"></div>
<div id="picker" class="ui" hidden></div>

<script src="../js/icons.js?v=1.2"></script>
<script src="../js/blocks.js?v=1.2"></script>
<script src="../js/app.js?v=1.2"></script>
<script src="mobile.js?v=1.2"></script>
</body>
</html>
